[project]
name = "conflict-aware-logit-purification"
version = "0.1.0"
description = "Conflict-Aware Logit Purification for Multi-Teacher Distillation in Low-Resource Text Classification"
requires-python = ">=3.14"
dependencies = [
    "datasets>=4.8.4",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "openai>=2.31.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.5",
    "scipy>=1.17.1",
    "tiktoken>=0.9.0",
    "torch>=2.12",
    "transformers>=4.48",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
